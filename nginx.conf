# ==============================================================================
# Mahi TechnoCrafts - High-Performance Production Nginx Configuration
# Port: 3111 (Next.js Application Server)
# File location on VPS: /etc/nginx/sites-available/mahitechnocrafts.in
# ==============================================================================

# 1. HTTP -> HTTPS Redirection (Port 80)
server {
    listen 80;
    listen [::]:80;
    server_name mahitechnocrafts.in www.mahitechnocrafts.in;
    return 301 https://mahitechnocrafts.in$request_uri;
}

# 2. HTTPS www -> non-www Canonical Redirection
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mahitechnocrafts.in;

    ssl_certificate /etc/letsencrypt/live/mahitechnocrafts.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mahitechnocrafts.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://mahitechnocrafts.in$request_uri;
}

# 3. Main Production Server (https://mahitechnocrafts.in)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mahitechnocrafts.in;

    client_max_body_size 200M;

    # SSL Certificates managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mahitechnocrafts.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mahitechnocrafts.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --------------------------------------------------------------------------
    # Security & HSTS Headers (Fixes PageSpeed 100/100 Best Practices)
    # --------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------------------
    # Gzip Compression (Huge speed boost for Mobile & Desktop)
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/js
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # --------------------------------------------------------------------------
    # Rule A: Next.js Bundled Static Files (_next/static)
    # Hashed JS and CSS files are immutable - Cache for 1 Year in Browser!
    # --------------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3111;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Rule B: Static Media Assets & Fonts (Images, SVGs, WOFF2)
    # Cache for 30 Days in Browser
    # --------------------------------------------------------------------------
    location ~* \.(webp|avif|jpg|jpeg|png|gif|svg|ico|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:3111;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Rule C: All Dynamic & Static HTML Routes
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3111;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
