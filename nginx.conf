# ==============================================================================
# Mahi TechnoCrafts - Ultra-Fast Nginx Production Configuration
# Specially optimized for Next.js (App Router, SSG, Static Assets & Caching)
# ==============================================================================

# Microcache zone for page HTML (10MB keys zone, 1GB disk storage)
# Put this line inside the 'http { ... }' block in /etc/nginx/nginx.conf if not already present:
# proxy_cache_path /var/cache/nginx/nextjs levels=1:2 keys_zone=NEXTJS_CACHE:10m max_size=1g inactive=60m use_temp_path=off;

# ------------------------------------------------------------------------------
# 1. HTTP to HTTPS Redirection (Non-www & www)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name mahitechnocrafts.in www.mahitechnocrafts.in;
    return 301 https://mahitechnocrafts.in$request_uri;
}

# ------------------------------------------------------------------------------
# 2. Redirect www.mahitechnocrafts.in -> mahitechnocrafts.in (Canonical Domain)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mahitechnocrafts.in;

    ssl_certificate /etc/letsencrypt/live/mahitechnocrafts.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mahitechnocrafts.in/privkey.pem;

    return 301 https://mahitechnocrafts.in$request_uri;
}

# ------------------------------------------------------------------------------
# 3. Main SSL Server Block (mahitechnocrafts.in)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mahitechnocrafts.in;

    # SSL Configuration (High Security)
    ssl_certificate /etc/letsencrypt/live/mahitechnocrafts.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mahitechnocrafts.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Performance: Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/js
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Client limits & buffers
    client_max_body_size 20M;
    client_body_buffer_size 128k;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # --------------------------------------------------------------------------
    # Rule A: Next.js Bundled Static Files (_next/static)
    # Next.js static JS/CSS files are hashed (immutable). Cache for 1 full year!
    # --------------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # 1 Year Immutable Browser Cache
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Rule B: Static Media & Fonts in /public (Images, Icons, Webfonts)
    # --------------------------------------------------------------------------
    location ~* \.(?:ico|jpg|jpeg|png|gif|svg|webp|avif|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # 30 Days Browser Cache
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Rule C: Real-Time APIs & Admin Portal (NEVER CACHE)
    # --------------------------------------------------------------------------
    location ~* ^/(api|admin|portal)/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Prevent any caching on sensitive routes
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    }

    # --------------------------------------------------------------------------
    # Rule D: Main HTML Pages (SSR / Static Pages)
    # Fast proxying with keepalive & optional microcaching
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep alive for fast TTFB
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
